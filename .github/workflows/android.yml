name: Build Zazan AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build frontend web assets
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || secrets.API_BASE_URL || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sqbzzinfdmrxyjvwrlns.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_lOk7hTWfKuDEr6r1Xc9qCA_aIx3ipIF' }}
        run: npm run build

      - name: Verify web assets exist
        run: |
          if [ ! -f "client/dist/index.html" ]; then
            echo "ERROR: client/dist/index.html was not generated!"
            exit 1
          fi
          echo "Verified: client/dist/index.html exists and is ready for Capacitor sync."

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zazan-ai-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
